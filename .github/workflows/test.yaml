name: Test

on:
  push:
  pull_request:

# A branch pushed twice in a minute only needs its newest commit checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The version rule compares a source against the branch it came from, which
          # needs history rather than a single commit.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install workflow checker
        run: bun run tools

      - name: Validate
        run: bun run validate --event
