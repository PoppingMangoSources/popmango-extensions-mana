name: Test

on:
  push:
  pull_request:

# A branch pushed twice in a minute only needs its newest commit checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The version rule compares a source against the branch it came from, which
          # needs history rather than a single commit.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      # The gate that matters most: mana-dev bundles with esbuild, which strips types
      # without checking them, so a source written against a removed API builds cleanly
      # and only goes wrong on the device.
      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Every rule CLAUDE.md and the mana-extension skill lay down that can be checked
      # without the live site: icons, intents, probe fixtures, CHANGELOG agreement, the
      # globals the runtime does not have, and the patch-only version rule.
      - name: Check source rules
        # A branch name is attacker-chosen on a fork's pull request, so it is read from the
        # environment rather than pasted into the script.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            node scripts/check-sources.mjs --base "origin/$BASE_REF"
          else
            node scripts/check-sources.mjs
          fi

      # The README table and the count badge are generated from dist/sources.json. A diff
      # here means they were hand-edited, or a version bump never reached them.
      - name: README is in step with the catalog
        run: |
          bun run readme
          if ! git diff --quiet -- README.md media/badge-count-summer.svg; then
            echo "::error::README is out of date — run 'bun run build && bun run readme' and commit the result"
            git --no-pager diff -- README.md media/badge-count-summer.svg
            exit 1
          fi
